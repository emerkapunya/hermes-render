# =========================================================
# ASPRI MRK — HERMES CONFIG
# =========================================================

timezone: Asia/Jakarta

# =========================================================
# MAIN MODEL
# =========================================================

model:
  provider: openrouter
  default: openrouter/free

# =========================================================
# FALLBACK MODELS
# =========================================================
# Catatan:
# Ini hanya membantu kalau model tertentu sedang penuh.
# Kalau kuota harian OpenRouter akun sudah habis total,
# fallback sesama OpenRouter tetap bisa ikut gagal.

fallback_providers:
  - provider: openrouter
    model: nvidia/nemotron-3-super-120b-a12b:free

  - provider: openrouter
    model: inclusionai/ring-2.6-1t:free

# =========================================================
# AUXILIARY TASKS
# =========================================================
# Paksa auxiliary task tetap memakai model gratis.

auxiliary:
  free_only: true

  compression:
    provider: openrouter
    model: nvidia/nemotron-3-super-120b-a12b:free
    fallback_chain:
      - provider: openrouter
        model: inclusionai/ring-2.6-1t:free

  web_extract:
    provider: openrouter
    model: nvidia/nemotron-3-super-120b-a12b:free
    fallback_chain:
      - provider: openrouter
        model: inclusionai/ring-2.6-1t:free

# =========================================================
# WEB SEARCH
# =========================================================

web:
  backend: tavily
  use_gateway: false
  keyless_fallback: true

# =========================================================
# MEMORY
# =========================================================

memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  write_approval: true

# =========================================================
# AGENT BEHAVIOR
# =========================================================

agent:
  tool_use_enforcement: true

# =========================================================
# TERMINAL / FILE SYSTEM
# =========================================================

terminal:
  backend: local
  cwd: /opt/data

# =========================================================
# DELEGATION
# =========================================================

delegation:
  max_iterations: 250