# =========================================================
# ASPRI MRK — HERMES CONFIGURATION
# =========================================================

timezone: Asia/Jakarta

# =========================================================
# MAIN MODEL
# =========================================================

model:
  provider: openrouter
  default: openrouter/free

# =========================================================
# FALLBACK MODEL
# =========================================================

fallback_providers:
  - provider: openrouter
    model: nvidia/nemotron-3-super-120b-a12b:free

# =========================================================
# AUXILIARY TASKS
# =========================================================

auxiliary:
  free_only: true
  openrouter_model: nvidia/nemotron-3-super-120b-a12b:free

# =========================================================
# WEB SEARCH
# =========================================================

web:
  keyless_fallback: true
  keyless_rescue: true

# =========================================================
# MEMORY & USER PROFILE
# =========================================================

memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  write_approval: true

# =========================================================
# AGENT
# =========================================================

agent:
  tool_use_enforcement: true

# =========================================================
# TERMINAL
# =========================================================

terminal:
  backend: local
  cwd: /opt/data

# =========================================================
# DELEGATION
# =========================================================

delegation:
  max_iterations: 250