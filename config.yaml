# =========================================================
# ASPRI MRK — HERMES CONFIGURATION
# =========================================================

timezone: Asia/Jakarta

# =========================================================
# MAIN MODEL
# =========================================================

model:
  provider: openrouter
  default: openrouter/free

# =========================================================
# FALLBACK MODELS
# =========================================================
# Membantu jika model tertentu penuh.
# Tidak mengatasi limit harian OpenRouter secara keseluruhan.

fallback_providers:
  - provider: openrouter
    model: nvidia/nemotron-3-super-120b-a12b:free

  - provider: openrouter
    model: inclusionai/ring-2.6-1t:free

# =========================================================
# AUXILIARY TASKS
# =========================================================
# Jangan izinkan auxiliary task memakai model berbayar.

auxiliary:
  free_only: true
  openrouter_model: nvidia/nemotron-3-super-120b-a12b:free

# =========================================================
# WEB SEARCH
# =========================================================
# Jangan mengunci ke Tavily atau provider tertentu.
# Biarkan Hermes memilih backend web yang tersedia.

web:
  keyless_fallback: true
  keyless_rescue: true

# =========================================================
# MEMORY
# =========================================================

memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  write_approval: true

# =========================================================
# AGENT BEHAVIOR
# =========================================================

agent:
  tool_use_enforcement: true

# =========================================================
# TERMINAL / FILE SYSTEM
# =========================================================

terminal:
  backend: local
  cwd: /opt/data

# =========================================================
# DELEGATION
# =========================================================

delegation:
  max_iterations: 250